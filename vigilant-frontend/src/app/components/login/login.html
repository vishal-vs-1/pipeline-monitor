<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold text-center justify-center mb-6">
        {{ isRegistering ? 'Create an Account' : 'Welcome to Vigilant' }}
      </h2>

      @if (error) {
        <div class="alert alert-error shadow-sm mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          <span>{{ error }}</span>
        </div>
      }

      <div class="flex flex-col gap-3 mb-6">
        <button class="btn btn-outline flex items-center justify-center gap-2" (click)="loginWithGithub()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          Continue with GitHub
        </button>
        <button class="btn btn-outline flex items-center justify-center gap-2" (click)="loginWithGoogle()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.515 2.7 1.545 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
          Continue with Google
        </button>
      </div>

      <div class="divider">OR</div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        
        @if (isRegistering) {
          <div class="form-control">
            <label class="label"><span class="label-text">Name</span></label>
            <input type="text" formControlName="name" placeholder="John Doe" class="input input-bordered" 
              [ngClass]="{ 'input-error': f['name'].invalid && f['name'].touched }" />
          </div>
        }

        <div class="form-control">
          <label class="label"><span class="label-text">Email</span></label>
          <input type="email" formControlName="email" placeholder="email@example.com" class="input input-bordered" 
            [ngClass]="{ 'input-error': f['email'].invalid && f['email'].touched }" />
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" formControlName="password" placeholder="••••••••" class="input input-bordered" 
            [ngClass]="{ 'input-error': f['password'].invalid && f['password'].touched }" />
        </div>

        <button type="submit" class="btn btn-primary mt-2" [disabled]="loginForm.invalid || loading">
          @if (loading) {
            <span class="loading loading-spinner"></span>
          }
          {{ isRegistering ? 'Sign Up' : 'Log In' }}
        </button>
      </form>

      <div class="text-center mt-4">
        <button class="btn btn-link no-underline text-sm" (click)="toggleMode()">
          {{ isRegistering ? 'Already have an account? Log in' : 'Need an account? Sign up' }}
        </button>
      </div>
    </div>
  </div>
</div>
