    <div class="drawer lg:drawer-open">
      <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />
      <div class="drawer-content flex flex-col items-center justify-start min-h-screen bg-base-200 relative w-full">
        <!-- Page content here -->
        @if (currentUser) {
          <label for="my-drawer-2" class="btn btn-primary drawer-button lg:hidden m-4 self-start">Open menu</label>
        }
        <div class="w-full">
            <router-outlet></router-outlet>
        </div>
      </div> 
      
      @if (currentUser) {
        <div class="drawer-side">
          <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label> 
          <div class="menu p-4 w-80 min-h-full bg-base-100 text-base-content border-r border-base-300 flex flex-col">
            <div class="mb-4">
              <h2 class="text-2xl font-bold px-4 text-primary tracking-wider">VIGILANT</h2>
            </div>
            <ul class="flex-1">
              <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a></li>
              <li><a routerLink="/config" routerLinkActive="active">Configuration</a></li>
            </ul>
            
            <div class="mt-auto pt-4 border-t border-base-300">
              <div class="flex items-center gap-3 px-4 py-2">
                <div class="avatar placeholder">
                  <div class="bg-neutral text-neutral-content rounded-full w-10">
                    <span class="text-xs">{{ currentUser?.name?.charAt(0) | uppercase }}</span>
                  </div>
                </div>
                <div class="flex-1 overflow-hidden">
                  <p class="text-sm font-semibold truncate">{{ currentUser?.name }}</p>
                  <p class="text-xs text-base-content/60 truncate">{{ currentUser?.email }}</p>
                </div>
              </div>
              <button class="btn btn-outline btn-error w-full mt-2" (click)="logout()">Logout</button>
            </div>
          </div>
        </div>
      }
    </div>
